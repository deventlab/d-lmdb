global
    maxconn 4096

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend kv_frontend
    bind *:80
    # PUT/DELETE are writes — must land on the leader.
    acl is_write method PUT DELETE
    # ?level=linearizable/lease reads also require the leader (ReadIndex /
    # lease-read both need to originate there) — a follower rejects these
    # with 503 NotLeader, same as a write. Only a plain/eventual GET can
    # go to any node.
    acl is_strong_read url_param(level) -m str linearizable lease
    use_backend write_backend if is_write
    use_backend write_backend if is_strong_read
    default_backend read_backend

# Only the node currently passing /primary (i.e. the leader) is in rotation.
# fall 2/rise 1 with a 2s interval: drops a dead leader within ~4s, and picks
# up a newly elected one as soon as a single health check confirms it.
backend write_backend
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 1
    server node1 node1:8080 check
    server node2 node2:8080 check
    server node3 node3:8080 check

# Any live node can serve reads — /status returns 200 regardless of role,
# it's just a liveness check here, not a leader check.
backend read_backend
    balance roundrobin
    option httpchk GET /status
    default-server inter 2s
    server node1 node1:8080 check
    server node2 node2:8080 check
    server node3 node3:8080 check
