[package]
name = "d-lmdb"
version = "0.1.0"
edition = "2021"
description = "Example implementation demonstrating how d-engine (Raft) adds distributed replication to LMDB, an embedded key-value store"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DEventLab/d-lmdb"
keywords = ["raft", "distributed", "key-value", "lmdb", "consensus"]
categories = ["database", "concurrency"]
rust-version = "1.88"

[dependencies]
# production: d-engine = "0.2"
d-engine = { git = "https://github.com/DEventLab/d-engine", branch = "main", default-features = false, features = ["server"] }

heed = "0.20"
bytes = "1"
prost = "0.13"
bincode = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"
config = { version = "0.14", default-features = false, features = ["toml"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
anyhow = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tracing-subscriber = "0.3"
d-engine = { git = "https://github.com/DEventLab/d-engine", branch = "main", default-features = false, features = ["server", "__test_support"] }

[[example]]
name = "single_node"
path = "examples/single-node/single_node.rs"

[[example]]
name = "three_node"
path = "examples/three-node/three_node.rs"
