name: Dependency Audit

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Audit dependencies
        # Version pinned to match Makefile's install-tools target — an
        # unpinned `cargo install` picks up whatever cargo-deny last shipped,
        # which can change license/advisory defaults and pass locally but
        # fail here (or vice versa) with no code change involved.
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny check all

      - name: Check compatibility
        run: cargo check --all-features
