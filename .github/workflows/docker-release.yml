name: Docker Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.1.1-rc1, 0.1.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  IMAGE: deventlab/d-lmdb

jobs:
  check-version:
    name: Check version and reject duplicates
    runs-on: ubuntu-latest
    outputs:
      stripped_version: ${{ steps.resolve.outputs.stripped_version }}

    steps:
      - name: Resolve version
        id: resolve
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${VERSION_INPUT:-$RELEASE_TAG}"
          [ -n "$VERSION" ] || { echo "ERROR: no version resolved from input or release tag"; exit 1; }
          echo "stripped_version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Reject if version tag already exists
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE }}
          STRIPPED_VERSION: ${{ steps.resolve.outputs.stripped_version }}
        run: |
          set +e
          ERR=$(docker buildx imagetools inspect "docker.io/${IMAGE}:${STRIPPED_VERSION}" 2>&1 >/dev/null)
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            echo "ERROR: ${STRIPPED_VERSION} already exists — will not overwrite"
            exit 1
          elif echo "$ERR" | grep -qi 'not found\|manifest unknown'; then
            echo "OK: ${STRIPPED_VERSION} is available"
          else
            echo "ERROR: inspect failed for an unrelated reason:"
            echo "$ERR"
            exit 1
          fi

  build-test-push:
    name: Build, test, push (${{ matrix.platform }})
    needs: check-version
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set platform tag for artifact naming
        shell: bash
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for this platform (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: d-lmdb-server:compose
          load: true

      - name: Run 3-node smoke test
        run: DLMDB_SKIP_BUILD=1 ./compose/smoke-test.sh

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Push tested image by digest
        id: push
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          TARGET="docker.io/${IMAGE}:${{ github.sha }}-${{ env.PLATFORM_PAIR }}"
          docker tag d-lmdb-server:compose "$TARGET"
          PUSH_OUTPUT=$(docker push "$TARGET" | tee /dev/stderr)
          mapfile -t DIGESTS < <(printf '%s\n' "$PUSH_OUTPUT" | grep -oE 'sha256:[a-f0-9]{64}')
          if [ "${#DIGESTS[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly 1 digest from docker push output, got ${#DIGESTS[@]}"
            exit 1
          fi
          DIGEST="${DIGESTS[0]}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ steps.push.outputs.digest }}"
          [ -n "$DIGEST" ] || { echo "ERROR: empty digest from push step"; exit 1; }
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-platform manifest
    runs-on: ubuntu-latest
    needs: [check-version, build-test-push]
    env:
      STRIPPED_VERSION: ${{ needs.check-version.outputs.stripped_version }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Create and push manifest list
        shell: bash
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          REFS=()
          for f in *; do
            REFS+=("docker.io/${IMAGE}@sha256:${f}")
          done
          docker buildx imagetools create \
            -t "docker.io/${IMAGE}:${STRIPPED_VERSION}" \
            -t "docker.io/${IMAGE}:latest" \
            "${REFS[@]}"

      - name: Verify manifest
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE }}
        run: docker buildx imagetools inspect "docker.io/${IMAGE}:${STRIPPED_VERSION}"
