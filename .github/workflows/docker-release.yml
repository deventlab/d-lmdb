name: Docker Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.1.1-rc1, 0.1.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: deventlab/d-lmdb

jobs:
  build-test-push:
    name: Build, test, push (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set platform tag for artifact naming
        shell: bash
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for this platform (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: d-lmdb-server:compose
          load: true

      - name: Run 3-node smoke test
        run: DLMDB_SKIP_BUILD=1 ./compose/smoke-test.sh

      # Must run before the Scout scan below — docker scout cves calls
      # Docker's backend to resolve vulnerability data even for local
      # images, and fails (exit 125) on a fresh runner with no session.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Scan for Medium+ CVEs (fail release if found)
        shell: bash
        run: |
          OUT=$(docker scout cves d-lmdb-server:compose --platform ${{ matrix.platform }} 2>&1)
          LINE=$(echo "$OUT" | grep 'vulnerabilities' || true)
          [ -n "$LINE" ] || { echo "$OUT"; exit 1; }
          C=$(echo "$LINE" | grep -o '[0-9]\+C' | grep -o '[0-9]\+' || echo 0)
          H=$(echo "$LINE" | grep -o '[0-9]\+H' | grep -o '[0-9]\+' || echo 0)
          M=$(echo "$LINE" | grep -o '[0-9]\+M' | grep -o '[0-9]\+' || echo 0)
          echo "CVEs: ${C}C ${H}H ${M}M"
          if [ "$C" -gt 0 ] || [ "$H" -gt 0 ] || [ "$M" -gt 0 ]; then
            echo "FAIL: Release blocked — Medium+ CVEs found"
            exit 1
          fi
          echo "PASS"

      - name: Push tested image by digest
        id: push
        shell: bash
        run: |
          TARGET="docker.io/${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.platform }}"
          docker tag d-lmdb-server:compose "$TARGET"
          docker push "$TARGET"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$TARGET" | grep -o 'sha256:[a-f0-9]\{64\}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-platform manifest
    runs-on: ubuntu-latest
    needs: build-test-push

    steps:
      - name: Resolve version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${VERSION_INPUT:-$RELEASE_TAG}"
          printf 'STRIPPED_VERSION=%s\n' "${VERSION#v}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Reject if version tag already exists
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          if docker buildx imagetools inspect "docker.io/${IMAGE}:${STRIPPED_VERSION}" >/dev/null 2>&1; then
            echo "ERROR: ${STRIPPED_VERSION} already exists — will not overwrite"
            exit 1
          fi
          echo "OK: ${STRIPPED_VERSION} is available"

      - name: Create and push manifest list
        shell: bash
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          # shellcheck disable=SC2046  # intentional word-splitting
          docker buildx imagetools create \
            -t "docker.io/${IMAGE}:${STRIPPED_VERSION}" \
            -t "docker.io/${IMAGE}:latest" \
            $(printf 'docker.io/%s@sha256:%s ' "${IMAGE}" *)

      - name: Verify manifest
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE }}
        run: docker buildx imagetools inspect "docker.io/${IMAGE}:${STRIPPED_VERSION}"
