# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
# Minimal, permissive config — tighten (add specific `skip`/`ignore` entries)
# as real conflicts surface.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
ignore = [
    "RUSTSEC-2025-0141",  # bincode 1.3.3 unmaintained but team considers it complete; no safe upgrade available
    #"RUSTSEC-0000-0000",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = ["GPL-2.0", "GPL-3.0", "AGPL-3.0"]
skip = [
    { crate = "windows-sys@0.52.0", reason = "transitive dep of ring 0.17 and socket2 0.5 (TLS stack); no upgrade path from ring/rustls" },
    { crate = "socket2@0.5.10", reason = "tonic 0.13 pins socket2 0.5 internally" },
    { crate = "rand_core@0.6.4", reason = "heed's lmdb-master-sys build-dependency chain (doxygen-rs -> phf -> rand 0.8); build-time only, not shipped in binary, upstream heed's choice" },
    { crate = "rand@0.8.6", reason = "same heed/lmdb-master-sys build-dependency chain as rand_core@0.6.4" },
    # Same as d-engine's own deny.toml — d-lmdb pulls these transitively via d-engine.
    { crate = "getrandom@0.2.17", reason = "ring 0.17 pins getrandom 0.2.x, no upgrade path" },
    { crate = "getrandom@0.3.4", reason = "rand_core 0.9 pins getrandom 0.3.x" },
    { crate = "r-efi@5.3.0", reason = "transitive dep of getrandom 0.3 (rand_core 0.9)" },
    { crate = "hashbrown@0.14.5", reason = "dashmap 6.1 pins hashbrown 0.14; dashmap 7 not yet stable" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/DEventLab/d-engine"]
